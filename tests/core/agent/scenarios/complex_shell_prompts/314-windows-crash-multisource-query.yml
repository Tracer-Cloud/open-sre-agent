id: 314-windows-crash-multisource-query
title: Windows crash diagnostic hands off and gathers across Sentry, GitHub, and PostHog
intent_class: complex_shell_prompts
input:
  prompt: Hey OpenSRE figure out why our OpenSRE agent is crashing on Windows machines by querying (a)
    sentry, (b) github issues, (c) posthog
session:
  has_prior_state: false
  configured_integrations:
  - sentry
  - github
  - posthog_mcp
  resolved_integrations:
    sentry:
      connection_verified: true
      organization_slug: fixture-org
      project_slug: fixture-project
      auth_token: fixture-token
      base_url: https://sentry.io
    github:
      connection_verified: true
      owner: tracer-cloud
      repo: opensre
      mode: streamable-http
      url: https://api.githubcopilot.com/mcp/
      auth_token: fixture-token
    posthog_mcp:
      connection_verified: true
      mode: streamable-http
      url: https://mcp.posthog.com/mcp
      auth_token: fixture-token
notes:
- 'Multi-source DIAGNOSTIC question ("figure out why ... is crashing") with no explicit investigate
  verb. The planner hands off: the evidence-gather pass makes quick tool calls against the named
  sources and the assistant answers from that evidence, closing with a full-investigation offer.
  investigation_start dispatches only on an explicit investigate instruction (336, 340) or after the
  user accepts that offer.'
- 'Gather fan-out, auth-independent: the fixture tokens 401 against the live endpoints, so call_any
  over the three integration tools asserts the gather loop engaged at least one named source — the
  deterministic, credential-free proof that the turn handed off to integration gathering rather than
  answering from hallucinated text (same reasoning as 338).'
- 'Dispatch negative control: forbidden_actions/investigation proves diagnostic phrasing across
  connected sources does not tip the planner into investigation_start. 313 covers the same prompt
  shape with no integrations connected.'
turn:
  expected_kind: agent
policy:
  executes_terminal_action: false
planned_actions:
- kind: assistant_handoff
  content: diagnostic:windows_crash_multisource
  source: llm
response_contract:
  must_contain_any:
  - sentry
  - github
  - posthog
  - Windows
  - crash
  must_contain_all:
  - Want me to
  - investigat
  must_not_contain:
  - $ /
  forbidden_actions:
  - investigation
  - shell
history:
  expected:
  - type: cli_agent
    ok: true
runs: 5
tool_actions:
- surface: gather
  tools:
  - search_sentry_issues
  - search_github_issues
  - list_posthog_tools
  expect: call_any
