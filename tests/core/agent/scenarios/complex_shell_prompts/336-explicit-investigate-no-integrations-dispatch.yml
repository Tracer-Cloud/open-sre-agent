id: 336-explicit-investigate-no-integrations-dispatch
title: Explicit investigate verb dispatches an investigation even with zero integrations connected
intent_class: complex_shell_prompts
input:
  prompt: 'investigate why the orders-api keeps OOM-killing its pods'
session:
  has_prior_state: false
  configured_integrations: []
  resolved_integrations: {}
notes:
- 'Pins the EXPLICIT-INVESTIGATE rule that diagnostic-question scenarios (313/314/344 handoff) deliberately
  do NOT exercise. Bare "why" / "figure out why" → assistant_handoff + gather + Want-me-to investigate
  offer (PendingInvestigationOffer). Explicit "investigate why…" → investigation_start ALWAYS, even when
  CONNECTED INTEGRATIONS is none.'
- 'Negative control: configured_integrations and resolved_integrations are BOTH empty, so if the planner
  incorrectly required connected sources for an explicit investigate verb it would hand off here. A
  passing run proves the explicit verb dispatches investigation_start with synthesized alert_text.'
- 'The synthesized alert_text varies per run, so planned_actions leaves content empty: the planning test
  asserts an investigation with non-empty alert_text rather than an exact string.'
turn:
  expected_kind: agent
policy:
  executes_terminal_action: true
planned_actions:
- kind: investigation
  source: llm
  target_surface: investigation
response_contract:
  must_contain_any:
  - investigat
  - rca
  - orders
  - oom
  - pod
  must_not_contain:
  - $ /
  - can't help
  - cannot help
  - I can't help
  - I cannot help
  forbidden_actions:
  - shell
history:
  expected:
  - type: alert
    ok: true
runs: 5
tool_actions:
- surface: dispatch
  kind: investigation
- surface: gather
  tools:
  - search_sentry_issues
  - search_github_issues
  - list_posthog_tools
  expect: not_called
