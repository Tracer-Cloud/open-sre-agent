id: 500-connect-local-llama-fail-closed
title: Connect local llama fail-closed
intent_class: remote
input:
  prompt: please connect to local llama
session:
  has_prior_state: false
  configured_integrations: []
  resolved_integrations: {}
notes: []
turn:
  expected_kind: agent
policy:
  executes_terminal_action: false
planned_actions:
- kind: assistant_handoff
  content: provider:local_llama_connect
  source: llm
response_contract:
  must_contain_any:
  - ollama
  - re:local (llm|llama|model)
  - /onboard
  - /model
  must_not_contain:
  - $ /
  # "llama" names a model runtime, not an integration or MCP server. Routing it
  # to either setup command is the misroute this scenario exists to catch.
  - integrations setup llama
  - mcp connect
history:
  expected:
  - type: cli_agent
    ok: true
runs: 3
tool_actions:
- surface: gather
  tools:
  - search_sentry_issues
  - search_github_issues
  - list_posthog_tools
  expect: not_called
