id: 600-follow-up-why-failed
title: Follow-up why failed
intent_class: follow_up
input:
  prompt: why did it fail?
session:
  has_prior_state: true
  configured_integrations: []
  resolved_integrations: {}
notes: []
turn:
  expected_kind: agent
policy:
  executes_terminal_action: false
planned_actions:
- kind: assistant_handoff
  content: follow_up:prior_investigation
  source: llm
response_contract:
  must_contain_any:
  # The answer must reference the prior RCA (disk full on orders-api). Models
  # paraphrase it ("the disk was full", "filled-up disk"), so match meaning:
  # disk + full in either order, and fail/failed/failure as one stem.
  - "re:disk\\b[^.]{0,30}(full|filled)|(full|filled)[^.]{0,30}\\bdisk"
  - re:fail(ed|ure|ing)?\b
  - orders-api
  - root cause
  must_not_contain:
  - $ /
history:
  expected:
  - type: cli_agent
    ok: true
runs: 3
tool_actions:
- surface: gather
  tools:
  - search_sentry_issues
  - search_github_issues
  - list_posthog_tools
  expect: not_called
