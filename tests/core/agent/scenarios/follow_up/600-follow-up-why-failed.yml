id: 600-follow-up-why-failed
title: Follow-up why failed
intent_class: follow_up
input:
  prompt: why did it fail?
session:
  has_prior_state: true
  configured_integrations: []
  resolved_integrations: {}
notes: []
turn:
  expected_kind: agent
policy:
  executes_terminal_action: false
planned_actions:
- kind: assistant_handoff
  content: follow_up:prior_investigation
  source: llm
response_contract:
  must_contain_any:
  # The answer must state the prior RCA's actual diagnosis — storage exhaustion
  # on orders-api. One pattern only, deliberately: any weaker alternative
  # ("orders-api", "root cause", "failed") is satisfied by a non-answer such as
  # "I don't know why it failed", which is exactly the regression this scenario
  # exists to catch. Models paraphrase the diagnosis ("the disk was full",
  # "filled-up disk", "ran out of space"), so match the meaning, not the wording.
  - "re:(disk|filesystem|volume|storage)\\b[^.]{0,40}(full|filled|out of space|no space)\
    |(full|filled|out of)\\b[^.]{0,40}(disk|filesystem|volume|storage|space)"
  must_not_contain:
  - $ /
history:
  expected:
  - type: cli_agent
    ok: true
runs: 3
tool_actions:
- surface: gather
  tools:
  - search_sentry_issues
  - search_github_issues
  - list_posthog_tools
  expect: not_called
