id: 347-session-goal-five-step-checklist
title: Conversational keep-going checklist attaches session_goal (no shell)
intent_class: chat_handoff
input:
  prompt: >-
    In chat only — do not use the shell, create files, or run commands.
    Walk through this 5-item checklist without asking whether to continue:
    (1) list the goal in one sentence, (2) name step one, (3) name step two,
    (4) name step three, (5) confirm all five checklist items are done.
    Keep going across turns until every item is covered.
session:
  has_prior_state: false
  configured_integrations: []
  resolved_integrations: {}
notes:
- 'Outer session goal: conversational multi-step / keep-going asks must
  set session_goal on assistant_handoff so the host loop continues without
  Want-me-to interruptions. Do not detect this from user prose alone —
  structured fields only.'
- 'Contrast the local multi-step shell rule: create/run/file sequences use
  shell_run. This prompt explicitly forbids local side effects so the planner
  must hand off with session_goal instead of inventing a /tmp state file.'
- 'Host continuation through all five outer turns is covered by harness/shell
  SessionGoal unit tests; this scenario pins the planner contract.'
turn:
  expected_kind: agent
policy:
  executes_terminal_action: false
planned_actions:
- kind: assistant_handoff
  content: session_goal:five_step_checklist
  # Pin the typed schema field the host loop keys on. It is a boolean, so the
  # planner cannot spell it three ways; the turn cap is a separate integer and
  # is not pinned here because a live planner may reasonably omit it.
  session_goal: true
  source: llm
response_contract:
  must_contain_any:
  - step
  - goal
  - checklist
  must_not_contain:
  - $ /
  - Want me to
  forbidden_actions:
  - investigation
  - shell
history:
  expected:
  - type: cli_agent
    ok: true
runs: 3
tool_actions:
- surface: gather
  tools:
  - search_sentry_issues
  - search_github_issues
  expect: not_called
