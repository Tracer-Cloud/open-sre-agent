id: 346-metric-read-windows-users
title: Product-analytics metric ask sets evidence_kind=metric_read on handoff
intent_class: chat_handoff
input:
  prompt: How many unique Windows users did we have in the last 7 days?
session:
  has_prior_state: false
  configured_integrations: []
  resolved_integrations: {}
notes:
- 'Ontology contract: metric/count-over-window asks must set the assistant_handoff
  schema field evidence_kind=metric_read (not bury it only in content prose). The
  harness classifies L0/L1 from that field + connectivity — never from user-text
  keywords.'
- 'No analytics integration is connected here on purpose: the planner still hands
  off with metric_read so the host can emit the upgrade CTA rather than silently
  answering without evidence.'
turn:
  expected_kind: agent
policy:
  executes_terminal_action: false
planned_actions:
- kind: assistant_handoff
  content: metric:windows_users_last_7_days
  evidence_kind: metric_read
  source: llm
response_contract:
  must_contain_any:
  - Windows
  - user
  - PostHog
  - analytics
  - integrat
  must_not_contain:
  - $ /
  forbidden_actions:
  - investigation
  - shell
history:
  expected:
  - type: cli_agent
    ok: true
runs: 3
tool_actions:
- surface: gather
  tools:
  - list_posthog_tools
  - call_posthog_tool
  expect: not_called
