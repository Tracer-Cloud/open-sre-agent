id: 344-database-slow-diagnostic-gather
title: Freeform database-slow diagnostic hands off and gathers from the connected source
intent_class: chat_handoff
input:
  prompt: why is the database slow?
session:
  has_prior_state: false
  configured_integrations:
  - datadog
  resolved_integrations:
    datadog:
      connection_verified: true
      api_key: fixture-api-key
      app_key: fixture-app-key
      site: datadoghq.com
      base_url: https://api.datadoghq.com
notes:
- 'DIAGNOSTIC cause question with a connected integration. The planner hands off: the evidence-gather
  pass queries the connected source, the assistant answers from that evidence, closing with a
  full-investigation offer. The pipeline dispatches only on an explicit investigate verb or after the
  user accepts the offer. Contrast 321: the same prompt with no integrations connected also hands off,
  but the gather pass has nothing to query.'
- 'call_any over the Datadog gather tools asserts the loop engaged the connected source (fixture
  credentials 401 against the live endpoint; "was called" is the deterministic, credential-free proof
  of gather fan-out — same reasoning as 338).'
turn:
  expected_kind: agent
policy:
  executes_terminal_action: false
planned_actions:
- kind: assistant_handoff
  content: diagnostic:database_slow
  source: llm
response_contract:
  must_contain_any:
  - database
  - slow
  must_not_contain:
  - $ /
  - can't help
  - cannot help
  forbidden_actions:
  - investigation
  - shell
history:
  expected:
  - type: cli_agent
    ok: true
runs: 3
tool_actions:
- surface: gather
  tools:
  - query_datadog_all
  - query_datadog_logs
  expect: call_any
