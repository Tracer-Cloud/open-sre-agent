id: 345-yes-after-investigation-offer
title: Bare yes after Want-me-to full investigation arms PendingInvestigationOffer and dispatches
intent_class: chat_handoff
input:
  prompt: "yes"
session:
  has_prior_state: false
  configured_integrations:
  - datadog
  resolved_integrations:
    datadog:
      connection_verified: true
      api_key: fixture-api-key
      app_key: fixture-app-key
      site: datadoghq.com
      base_url: https://api.datadoghq.com
  pending_investigation_alert: |
    why is the database slow?

    Evidence gathered:
    p95 latency elevated on checkout-db
  conversation_seed:
  - role: user
    content: why is the database slow?
  - role: assistant
    content: |
      Datadog shows elevated query latency on checkout-db.

      **Want me to:** run a full investigation.
notes:
- 'Phase 1b accept path. Session already holds PendingInvestigationOffer (as armed
  after the diagnostic gather answer). Bare "yes" expands to opensre:investigation_start
  and dispatches investigation_start with the seeded alert_text — no prose scrape,
  no onboarding handoff.'
- 'Planning asserts the deterministic accept path (same as action_driver literal
  investigation_start). Oracle runs execute_shell_turn which expands via run_turn.'
turn:
  expected_kind: agent
policy:
  executes_terminal_action: true
planned_actions:
- kind: investigation
  source: deterministic
  target_surface: investigation
  content: |
    why is the database slow?

    Evidence gathered:
    p95 latency elevated on checkout-db
response_contract:
  must_contain_any:
  - investigat
  - database
  - slow
  must_not_contain:
  - can't help
  - cannot help
  - I can't help
  - I cannot help
  forbidden_actions:
  - shell
history:
  expected:
  - type: alert
    ok: true
runs: 1
tool_actions:
- surface: dispatch
  kind: investigation
