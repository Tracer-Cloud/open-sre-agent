schema_version: 1
mode: native

model:
  harbor_model: gradient_ai/openai-gpt-5.5
  provider: openai
  transport: sdk
  reasoning_effort: medium

grafana:
  username: admin
  password: admin
  compatibility_token: orca-basic-auth
  verify_ssl: true

runtime:
  report_path: /app/report.md
  artifact_dir: /logs/agent/opensre-orca
  environment_ready_path: /tmp/env-ready
  environment_ports_path: /tmp/env-ports
  readiness_timeout_seconds: 180
  grafana_timeout_seconds: 10
