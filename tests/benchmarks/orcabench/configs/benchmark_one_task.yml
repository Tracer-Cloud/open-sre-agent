schema_version: 1
profile: benchmark
# native: keeps OpenSRE's typed investigation surface with only ORCA backend adaptations.
# terminus_parity: also exposes lower-level ORCA/Grafana tools that Terminus can reach through shell commands.
tool_capability_mode: terminus_parity

model:
  harbor_model: gradient_ai/openai-gpt-5.5
  provider: openai
  transport: sdk
  reasoning_effort: medium
  max_tokens: 16384
  temperature: 1

grafana:
  username: admin
  password: admin
  compatibility_token: orca-basic-auth
  verify_ssl: true

runtime:
  report_path: /app/report.md
  source_root: /app/opentelemetry-demo
  artifact_dir: /logs/agent/opensre-orca
  environment_ready_path: /tmp/env-ready
  environment_ports_path: /tmp/env-ports
  readiness_timeout_seconds: 180
  grafana_timeout_seconds: 10
