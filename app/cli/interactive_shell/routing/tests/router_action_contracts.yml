      content: "integrations verify --dry-run"
      source: "llm"
      target_surface: "terminal"
      payload: "integrations verify --dry-run"

- id: nitro_connect_regression
  input: 'I want to connect to OpenSRE that I have running on a remote EC2 Nitro instance, and then I want to send it an investigation. Can you please connect the instance and send it "hello world"'
  expected_kind: "cli_agent"
  expected_unhandled: false
  expected_actions:
    - kind: "slash"
      content: "/remote"
      source: "llm"
      target_surface: "slash"
      command: "/remote"
      args: []
    - kind: "investigation"
      content: "hello world"
      source: "llm"
      target_surface: "investigation"

