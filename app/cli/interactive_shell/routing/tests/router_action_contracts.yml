      content: "/list integrations"
      source: "llm"
      target_surface: "slash"
      command: "/list"
      args: ["integrations"]

- id: health_then_connected_services
  input: "check the health of my opensre and then show me all connected services"
  expected_kind: "cli_agent"
  expected_unhandled: false
  expected_actions:
    - kind: "slash"
      content: "/health"
      source: "llm"
      target_surface: "slash"
      command: "/health"
      args: []
    - kind: "slash"
      content: "/list integrations"
      source: "llm"
      target_surface: "slash"
      command: "/list"
      args: ["integrations"]

- id: cli_command_verify_dry_run
  input: "please run opensre integrations verify --dry-run"
  expected_kind: "cli_agent"
  expected_unhandled: false
  expected_actions:
