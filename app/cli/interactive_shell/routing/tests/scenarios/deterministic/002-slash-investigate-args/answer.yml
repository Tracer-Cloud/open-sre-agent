route:
  expected_kind: slash
  expected_signals:
  - slash_prefix
  expected_command_text: /investigate alert.json
policy:
  should_execute: true
  has_unhandled_clause: false
  fail_closed: false
planned_actions:
- kind: slash
  source: deterministic
  target_surface: slash
  command: /investigate
  args:
  - alert.json
  content: /investigate alert.json
executed_actions:
- kind: slash
  command: /investigate
  args:
  - alert.json
  content: /investigate alert.json
response_contract:
  must_contain_any:
  - ran /investigate alert.json
  must_not_contain: []
history:
  expected:
  - type: slash
    ok: true
tier: critical
runs: 1
