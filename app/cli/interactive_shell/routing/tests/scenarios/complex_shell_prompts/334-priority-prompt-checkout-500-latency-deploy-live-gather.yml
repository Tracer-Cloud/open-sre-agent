  - query_datadog_logs
  - query_datadog_events
  - query_datadog_metrics
  - query_datadog_monitors
  - query_grafana_logs
  - query_grafana_metrics
  - query_grafana_annotations
  must_not_call:
  - search_sentry_issues
  - search_github_issues
  - list_posthog_tools
history:
