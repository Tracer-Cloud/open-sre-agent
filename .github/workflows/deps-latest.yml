# Weekly canary: install without uv.lock so PyPI resolution matches unpinned pyproject
# ranges and surfaces upstream breakages (e.g. OpenAI SDK init changes) early.

name: Dependency resolution (latest)

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sdk-init-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies (latest resolves from pyproject)
        run: uv pip install --python "$(which python)" --system -e ".[dev]"

      - name: Guardrails + LLM client tests
        run: >-
          python -m pytest -q
          tests/test_guardrails/test_llm_integration.py::TestOpenAIClientGuardrails::test_redacts_before_api_call
          tests/services/test_llm_client.py

      - name: Create issue when scheduled canary fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'in:title "Dependency resolution (latest) canary failed"' \
            --json number \
            --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            echo "Failure issue already open: #$EXISTING"
            exit 0
          fi
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dependency resolution (latest) canary failed" \
            --body "Scheduled canary failed in run https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
