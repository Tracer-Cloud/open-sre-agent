name: Interactive Shell Live (PR + post-merge)

on:
  pull_request:
    branches: [main]
    paths:
      - "core/agent/**"
      - "core/agent_harness/**"
      - "tests/core/agent/**"
      - "surfaces/interactive_shell/**"
      - "core/runtime/**"
      - "tools/**"
      - "integrations/**"
      - "pytest.ini"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/interactive-shell-live.yml"
  push:
    branches: [main]
    paths:
      - "core/agent/**"
      - "core/agent_harness/**"
      - "tests/core/agent/**"
      - "surfaces/interactive_shell/**"
      - "core/runtime/**"
      - "tools/**"
      - "integrations/**"
      - "pytest.ini"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/interactive-shell-live.yml"
permissions:
  contents: read

concurrency:
  group: interactive-shell-live-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  turn-checks:
    name: turn-checks (no-LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      OPENSRE_DISABLE_KEYRING: "1"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest-known"  # avoid live ndjson "latest" fetch flakes
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Deterministic turn + fixture integrity
        run: >-
          uv run python -m pytest -n auto -v
          tests/core/agent/
          -m "not live_llm"
