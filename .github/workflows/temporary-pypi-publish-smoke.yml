name: Temporary PyPI publish smoke

on:
  push:
    branches:
      - codex/4698-pypi-publish

permissions:
  contents: read

jobs:
  build-python-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest-known"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build and validate Python distributions
        shell: bash
        run: |
          set -euo pipefail
          version="0.1.2099.1.1+ci.${GITHUB_SHA:0:7}"
          python infrastructure/deployment/packaging/sync_release_version.py --version "$version"
          uv sync --frozen --extra release-dist
          uv run python -m build
          uv run twine check dist/*
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run python infrastructure/deployment/packaging/validate_wheel.py "$wheel"

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-python-dist
          path: dist/*
          if-no-files-found: error

  validate-publish-handoff:
    runs-on: ubuntu-latest
    needs: build-python-dist
    permissions:
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest-known"

      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-python-dist
          path: dist

      - name: Validate publish inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          uvx --from twine==7.0.0 twine check dist/*
          sha256sum dist/*
