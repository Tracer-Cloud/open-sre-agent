name: HealOps CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "pytest.ini"
      - "Makefile"
      - ".github/workflows/healops-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "pytest.ini"
      - "Makefile"
      - ".github/workflows/healops-ci.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: healops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: make lint

      - name: Format check (ruff)
        run: uv run python -m ruff format --check app/ tests/

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Type check (mypy)
        run: uv run python -m mypy app/

  test-synthetic:
    name: test-synthetic
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 20
    # Requires ANTHROPIC_API_KEY secret — skips gracefully when not set
    continue-on-error: true

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Skip if no API key
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: |
          echo "ANTHROPIC_API_KEY not set — skipping synthetic tests"
          echo "Add ANTHROPIC_API_KEY to repo secrets to enable this job"
          exit 0

      - name: Run synthetic tests
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: make test-synthetic
