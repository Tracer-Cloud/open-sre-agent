name: Routing Nitro E2E

on:
  push:
    branches: [main]
    paths:
      - "app/cli/interactive_shell/**"
      - "app/deployment/**"
      - "app/remote/**"
      - "tests/cli/interactive_shell/routing/test_nitro_prompt_live_e2e.py"
      - "tests/deployment/ec2/infrastructure_sdk/**"
      - "pytest.ini"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/routing-nitro-e2e.yml"

permissions:
  contents: read

concurrency:
  group: routing-nitro-e2e-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  nitro-e2e:
    name: nitro-prompt-live-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENSRE_API_KEY: ${{ secrets.OPENSRE_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run Nitro prompt live E2E
        run: >-
          uv run python -m pytest -q
          -m "live_aws and live_llm"
          tests/cli/interactive_shell/routing/test_nitro_prompt_live_e2e.py
